modules:
  jira:issuePanel:
    - key: kpi-issue-panel
      resource: issue-panel
      resolver:
        function: resolver
      title: KPIs${TITLE_SUFFIX}
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  jira:globalPage:
    - key: kpi-timeline-page
      resource: timeline
      resolver:
        function: resolver
      title: KPI Timeline${TITLE_SUFFIX}
      layout: native
  jira:adminPage:
    - key: kpi-settings-page
      resource: settings
      resolver:
        function: resolver
      title: KPI Settings${TITLE_SUFFIX}
      layout: blank
  jira:entityProperty:
    - key: kpi-index
      entityType: issue
      propertyKey: kpi-assignments
      values:
        - path: kpiIds
          type: text
          searchAlias: kpiIds
  jira:customField:
    - key: kpi-reading
      name: KPI Reading${TITLE_SUFFIX}
      description: >-
        Append-only KPI reading value, written by the Measure of Success app as
        the person recording it. Each recorded value is an embedded-date entry;
        the reading series is reconstructed from this field's changelog
        (storage-model.md, Option B). Don't edit it by hand.
      type: string
      # Editable on purpose (spec 10, Path A): readings are written AS THE USER
      # through the standard issue edit, so Jira requires Edit Issues on the KPI
      # and the changelog names who recorded each value. The field is on no
      # screen, so Jira doesn't show it.
      readOnly: false
  function:
    - key: resolver
      handler: index.handler

resources:
  - key: issue-panel
    path: static/issue-panel/build
  - key: timeline
    path: static/timeline/build
  - key: settings
    path: static/settings/build

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - storage:app
    # Writing the app-managed KPI Reading field via the app custom field value
    # API (PUT /rest/api/3/app/field/{id}/value). Docs list this as currently
    # optional but recommended and eventually mandatory. Adding a scope requires
    # `forge install --upgrade` on next deploy.
    - write:app-data:jira
    # KPI-space provisioning (Settings → Create space): create the project and
    # provision/associate the `KPI` issue type + scheme.
    - manage:jira-project
    - manage:jira-configuration
    # Standard issue types (Epic, Story, ...) expose their icon as a static
    # site asset (no scope needed), but CUSTOM issue types (Initiative,
    # Outcome, KPI, ...) serve theirs via `GET /rest/api/2/universal_avatar/...`,
    # which Forge gates behind this scope — without it `fetchIconDataUrl`
    # silently gets a non-OK response and the timeline falls back to the plain
    # diamond marker for every custom issue type.
    - read:avatar:jira
  # The timeline tooltip renders the contributing issue's TYPE icon, served from
  # the Jira site (issuetype.iconUrl / issue-picker `img`). Custom UI must be
  # allowed to load those images.
  external:
    images:
      - 'https://*.atlassian.net'
      - 'https://api.atlassian.com'

app:
  runtime:
    name: nodejs22.x
  # Not committed: each fork registers its own app (`npm run forge -- register`)
  # which stores the UUID in the repo-root `.env` as APP_ID. See README.md.
  id: ari:cloud:ecosystem::app/${APP_ID}

# Per-environment label appended to every user-visible title so dev/staging
# installs on the same site are distinguishable (e.g. "KPIs (staging)" in the
# issue app menu). Set by the `deploy:*` / `tunnel` npm scripts; production
# deploys leave it empty.
environment:
  variables:
    - APP_ID
    - key: TITLE_SUFFIX
      default: ''
